<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinite Outliner</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app"></div>

    <!-- Load external libraries -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/idb@7/build/umd.js"></script>
    <script src="https://unpkg.com/vue3-virtual-scroller@0.2.1/dist/vue3-virtual-scroller.umd.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/vue3-virtual-scroller@0.2.1/dist/vue3-virtual-scroller.css">

    <script>
        // Wait for all libraries to load before loading app.js
        window.addEventListener('load', function() {
            // Additional wait to ensure libraries are fully parsed
            setTimeout(function() {
                console.log('Checking libraries...');
                console.log('Vue:', typeof Vue);
                console.log('idb:', typeof idb);
                console.log('VueVirtualScroller:', typeof VueVirtualScroller);
                console.log('window keys containing "vue":', Object.keys(window).filter(k => k.toLowerCase().includes('vue')));
                console.log('window keys containing "scroller":', Object.keys(window).filter(k => k.toLowerCase().includes('scroller')));

                if (typeof Vue === 'undefined') {
                    console.error('Vue failed to load from CDN. Please check your internet connection.');
                    document.getElementById('app').innerHTML = '<div style="padding: 20px; text-align: center;"><h2>Error: Vue.js failed to load</h2><p>Please check your internet connection and refresh the page.</p></div>';
                } else if (typeof idb === 'undefined') {
                    console.error('idb failed to load from CDN.');
                    document.getElementById('app').innerHTML = '<div style="padding: 20px; text-align: center;"><h2>Error: IndexedDB library failed to load</h2><p>Please check your internet connection and refresh the page.</p></div>';
                } else {
                    console.log('Core libraries loaded, proceeding with app.js...');
                    // Load app.js after all dependencies are confirmed available
                    var script = document.createElement('script');
                    script.src = 'app.js';
                    document.body.appendChild(script);
                }
            }, 200); // Increased delay
        });
    </script>
</body>
</html>
